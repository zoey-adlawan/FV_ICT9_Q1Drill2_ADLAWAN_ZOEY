<!DOCTYPE html>
<html lang="en">
<head></head>
    <title>Q1 Drill 2</title>
    <style>
        h1{
            font-family:'Franklin Gothic Medium';
            color: brown;
        }
        body{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            background-color: antiquewhite;
        }
        section{
            background-color: burlywood;
            padding: 10px;
            margin:0ic;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 2px 5px burlywood;
            text-align: left;
        }
        img{
            height: 50px;
            width: 50px;
        }
        p{
            color: brown;
        }
    </style>
</head>
<body>
    <h1>Rate the Movie!</h1>
    <p>rate my favorite movies!</p>
<header>
<section>
        <form action="">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLNSo7D77dJr3wCKtfCmffqQ1AHvR-lpfo7PR83IR8LiUFsPZI4QLpdK4&s=10" alt="Movie Logo">
            <br>
            <label for="movies">Select a Movie</label>
                <select id="Movies">
                    <option value="m1">Dead Poets Society</option>
                    <option value="m2">Paddignton</option>
                    <option value="m3">Iron Man</option>
                    <option value="m4">Call Me By Your Name</option>
                </select>
                <br>
            <label for="">Genre/s</label>
            <br>
            <input type="checkbox" id="genre1" name="genre1">
                <label for="genre1">Coming of Age, Psychological</label>
            <input type="checkbox" id="genre2" name="genre2">
                <label for="genre2">Adventure, Comedy</label>
            <input type="checkbox" id="genre3" name="genre3">
                <label for="genre3">Action, Science Fiction</label>
            <input type="checkbox" id="genre4" name="genre4">
                <label for="genre4">Coming of Age, Psychological</label>
                <br>
            <label for="">Rating</label>
            <br>
            <input type="radio" id="rate1" name="rating">
                <label for="rate1">⭐</label>
            <input type="radio" id="rate2" name="rating">
                <label for="rate2">⭐⭐</label>
            <input type="radio" id="rate3" name="rating">
                <label for="rate3">⭐⭐⭐</label>
            <input type="radio" id="rate4" name="rating">
                <label for="rate4">⭐⭐⭐⭐</label>
            <input type="radio" id="rate5" name="rating">
                <label for="rate5">⭐⭐⭐⭐⭐</label>
            <br><br>
            For movie review tips, click <a href="https://www.fantasy-animation.org/current-posts/how-to-write-a-movie-review-a-step-by-step-guide" target="_blank">here</a>
            <br><br>
            <textarea id="Review" name="review" rows="4" cols="30" placeholder="Movie Review"></textarea>
            <br><br>
            <input type="Submit" id="submit" name="submit" value="Submit Your Rating">
            <br>
        </form>
    </section>
</header>
</body>
</html>
